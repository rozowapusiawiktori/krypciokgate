name: Deploy na VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Klucz SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Wdrozenie z GitHuba
        run: |
          ssh -o BatchMode=yes "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' <<'REMOTE'
          set -e
          cd /opt/krypciokgate

          # proces PM2 zyje pod uzytkownikiem krypciok, nie root
          asapp() { runuser -u krypciok -- "$@"; }

          # kopia przed zmiana
          mkdir -p /root/kcg-rollback
          cp bot.js /root/kcg-rollback/bot.js.prev 2>/dev/null || true
          git rev-parse HEAD > /root/kcg-rollback/commit.prev 2>/dev/null || true

          git fetch origin main --depth=1
          git reset --hard origin/main

          # bramka: skladnia przed restartem
          node --check bot.js || { echo "BLAD SKLADNI — rollback"; git reset --hard "$(cat /root/kcg-rollback/commit.prev)"; exit 1; }

          asapp npm ci --omit=dev >/dev/null 2>&1 || asapp npm install --omit=dev >/dev/null 2>&1
          chown -R krypciok:krypciok /opt/krypciokgate/bot.js /opt/krypciokgate/node_modules 2>/dev/null || true

          asapp pm2 restart krypciokgate --update-env >/dev/null
          sleep 8

          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 http://127.0.0.1:8080/health)
          echo "health=$CODE"
          if [ "$CODE" != "200" ]; then
            echo "BRAK HEALTH — rollback"
            git reset --hard "$(cat /root/kcg-rollback/commit.prev)" 2>/dev/null || true
            asapp pm2 restart krypciokgate >/dev/null
            exit 1
          fi
          echo "DEPLOY OK $(git rev-parse --short HEAD)"
          REMOTE
